# Deploys the MCP server as its OWN Cloud Run service ("gaian-data-lake-mcp"),
# separate from "dashboard", following the same build pattern as the
# top-level cloudbuild.yaml. Point a Cloud Build trigger at this file with
# an included-files filter on mcp-server/** so it doesn't fire on dashboard
# frontend changes (and vice versa).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gaian-data-lake-mcp:$COMMIT_SHA
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gaian-data-lake-mcp:latest
      - mcp-server

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gaian-data-lake-mcp

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - gaian-data-lake-mcp
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gaian-data-lake-mcp:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --quiet

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gaian-data-lake-mcp:$COMMIT_SHA
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/gaian-data-lake-mcp:latest

options:
  logging: CLOUD_LOGGING_ONLY
